name: Product QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    # Standard public runners are free; never run this job on a private copy.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: Windows native fixture acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .qa-output | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /out:.qa-output\DeskCheckFixture.exe test\Fixture.cs
          if ($LASTEXITCODE -ne 0) { throw 'Fixture compilation failed' }
          python test/native_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Native acceptance failed' }
      - name: Wheel build
        run: python -m pip wheel --no-deps --wheel-dir .qa-output/wheels .
      # No artifacts, caches, releases or publishing: avoid storage charges.
