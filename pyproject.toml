[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deskcheck-ai"
version = "0.2.0"
description = "Offline deterministic mock and Windows standard-control testing with MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "Pillow>=10"]

[project.scripts]
deskcheck = "deskcheck.cli:main"

[tool.setuptools.packages.find]
include = ["deskcheck*"]

[tool.setuptools.package-data]
deskcheck = ["assets/*.png", "assets/*.txt"]
